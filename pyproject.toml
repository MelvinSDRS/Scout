[project]
name = "scout"
version = "0.1.0"
description = "Self-hosted Facebook Marketplace explorer and watch alerts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "docs/nationwide-LICENSE.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "playwright>=1.58,<2",
    "python-dotenv>=1,<2",
    "websockify>=0.13,<1",
    "pillow>=11,<13",
    "opencv-python-headless>=4.11,<5",
]
[project.urls]
Repository = "https://github.com/MelvinSDRS/Scout"
Issues = "https://github.com/MelvinSDRS/Scout/issues"
Documentation = "https://github.com/MelvinSDRS/Scout#readme"

[project.scripts]
scout = "scout.cli:main"
scout-login = "scout.login_client:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Explicit release contents keep operator state and local workspace files out of archives.
[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/tools", "/deploy", "/docs", "/.github",
    "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md",
    "/.env.example", "/.gitignore", "/pyproject.toml", "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]
