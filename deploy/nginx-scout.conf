worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    # Resolve the Gluetun container through Docker DNS at request time so a
    # recreated container does not leave Nginx pointing at a stale address.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Only the NPM bridge address may supply an external forwarded scheme.
    # Every other caller gets headers derived from this gateway connection.
    map "$remote_addr:$http_x_forwarded_proto" $scout_forwarded_proto {
        default $scheme;
        "172.28.0.2:http" http;
        "172.28.0.2:https" https;
    }

    map $remote_addr $scout_forwarded_for {
        default $remote_addr;
        172.28.0.2 $proxy_add_x_forwarded_for;
    }

    map "$remote_addr:$http_x_forwarded_host" $scout_forwarded_host {
        default $host;
        "~^172\\.28\\.0\\.2:.+" $http_x_forwarded_host;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8765;
        server_name scout.example.com localhost;

        location / {
            set $scout_upstream http://gluetun:8765;
            proxy_pass $scout_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $scout_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scout_forwarded_proto;
            proxy_set_header X-Forwarded-Host $scout_forwarded_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }
}
